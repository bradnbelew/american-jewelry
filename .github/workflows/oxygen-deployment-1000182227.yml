name: Storefront 1000182227
on: [push]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Oxygen
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storefront
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          check-latest: true

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('storefront/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build and Publish to Oxygen
        run: npm run deploy
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000182227 }}

      - name: Report Oxygen preview URL
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const deployment = JSON.parse(fs.readFileSync('h2_deploy_log.json', 'utf8'));
          const url = new URL(deployment.url);
          if (url.protocol !== 'https:' || !url.hostname.endsWith('.myshopify.dev')) {
            throw new Error('Unexpected Oxygen deployment URL');
          }
          console.log(`Oxygen deployment: ${url.origin}`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `[Open American Jewelry](${url.origin}/)\n`);
          NODE
